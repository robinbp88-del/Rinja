# Runs Rinja monitoring on a schedule once the app is deployed.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   MONITOR_URL           e.g. https://your-app.example.com/api/check-watches
#   MONITOR_CRON_SECRET   must match MONITOR_CRON_SECRET in production env
#
# Do NOT append ?force=1 here — that bypasses due scheduling (use monitor:once locally).

name: Monitor watches

on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check-watches:
    runs-on: ubuntu-latest
    steps:
      - name: Run monitoring engine
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_CRON_SECRET: ${{ secrets.MONITOR_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${MONITOR_URL:-}" ] || [ -z "${MONITOR_CRON_SECRET:-}" ]; then
            echo "::error::Missing MONITOR_URL or MONITOR_CRON_SECRET secrets."
            exit 1
          fi

          # Strip accidental ?force=1 from secret URL so schedule stays due-based.
          BASE_URL="${MONITOR_URL%%\?*}"

          echo "POST ${BASE_URL}"
          BODY_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS --max-time 120 \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${MONITOR_CRON_SECRET}" \
            -H "Cache-Control: no-store" \
            -H "Accept: application/json" \
            "$BASE_URL")"

          echo "HTTP ${HTTP_CODE}"
          cat "$BODY_FILE"
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Monitor endpoint returned HTTP ${HTTP_CODE}"
            exit 1
          fi
