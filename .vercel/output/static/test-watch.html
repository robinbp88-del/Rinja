<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rinja alert test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0b0d12;
        color: #f5f5f7;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 28px 32px;
        background: #161821;
        text-align: center;
      }
      .label {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9b9bb0;
      }
      #price {
        margin-top: 12px;
        font-size: 48px;
        font-weight: 700;
        color: #c4b5fd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="label">Test product price</div>
      <div id="price">50 kr</div>
    </div>
  </body>
</html>
